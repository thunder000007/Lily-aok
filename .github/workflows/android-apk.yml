name: Build LillyBD Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - lillybd-firebase-upgrade
    paths:
      - 'www/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-apk.yml'

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Check app JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("www/index.html").read_text(encoding="utf-8")
          match = re.search(r'<script type="module">\s*(.*?)</script>', html, re.S)
          if not match:
              raise SystemExit("Could not find LillyBD module script")
          Path("/tmp/lillybd-check.mjs").write_text(match.group(1), encoding="utf-8")
          PY
          node --check /tmp/lillybd-check.mjs
      - name: Generate Android project
        run: npx cap add android
      - name: Sync web assets
        run: npx cap sync android
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LillyBD-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
