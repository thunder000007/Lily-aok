name: Deploy Firebase Functions
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - "firebase.json"
      - ".github/workflows/deploy-functions.yml"
jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LILLYBD_F499D }}
      - run: npm install -g firebase-tools
      - name: Deploy Cloud Functions
        run: firebase deploy --only functions --project lillybd-f499d --non-interactive
